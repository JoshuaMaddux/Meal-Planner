<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">

<title>Family Meals</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
</head>

<body>

<!-- WEEK -->
<div id="s-week" class="screen">
  <div class="sb"></div>
  <div class="scroller">
    <div class="pg-title">Dinners</div>
    <div class="pg-sub" id="wk-sub"></div>

    <div class="hero" id="hero-card">
      <span id="h-emoji" class="hero-emoji"></span>
      <div id="h-wk" class="hero-wk"></div>
      <div id="h-name" class="hero-name"></div>
      <div id="h-theme" class="hero-theme"></div>

      <div class="hero-chips">
        <span id="h-protein" class="chip chip-acc"></span>
      </div>

      <div class="hero-nav">
        <button class="hn-btn hn-prev" onclick="goWk(currentWeek-1)">←</button>
        <div class="hn-sel">
          <select id="wk-sel" onchange="goWk(parseInt(this.value))"></select>
        </div>
        <button class="hn-btn hn-next" onclick="goWk(currentWeek+1)">→</button>
      </div>
    </div>

    <div class="week-actions">
      <button class="wa-btn" onclick="openThemePicker()">🎨 Theme</button>
    </div>

    <div id="day-list"></div>
  </div>
</div>

<!-- SHOP -->
<div id="s-shop" class="screen hidden">
  <div class="sb"></div>
  <div class="scroller">
    <div class="pg-title">Shopping</div>
    <div id="shop-content"></div>
  </div>
</div>

<!-- TAB BAR -->
<div class="tab-bar">
  <button class="tb active" onclick="switchTab('week',this)">🍽</button>
  <button class="tb" onclick="switchTab('shop',this)">🛒</button>
</div>

<!-- THEME -->
<div id="ov-theme" class="overlay">
  <div class="sheet">
    <div class="sh-hdr">
      <div class="sh-title">Choose Theme</div>
    </div>
    <div id="theme-grid" class="theme-grid"></div>
  </div>
</div>

<script src="./js/data.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
